[Grid]
X1-grid         1   4.0     128      l    160.0
X2-grid         1   0.1     128      u    3.0415926535897932
X3-grid         1   0.0     128      u    6.2831853071795864

[TimeIntegrator]
CFL             0.5
tstop           75400.1
max_runtime     9.5
nstages         2

[Hydro]
solver          hllc
csiso           userdef
viscosity       explicit    userdef

[Gravity]
potential       userdef

[Boundary]
X1-beg          outflow
X1-end          outflow
X2-beg          outflow
X2-end          outflow
X3-beg          periodic
X3-end          periodic

[Setup]
epsilon         0.05
alpha           0.01
densityFloor    1e-6
gravity         Kepler
tilt            30
spin            0.1

[Output]
uservar         InvDt Vperp vCrosshx1 vCrosshx2 vCrosshx3
vtk             500.0
vtk_slice1      500.0      2   0.0                     cut
vtk_slice2      500.0      2   3.1415926535897932      cut
vtk_slice3      500.0      2   1.5707963267948966      cut
vtk_slice4      500.0      2   4.7123889803846898      cut
vtk_dir         output/vtk
dmp             1000.0
dmp_dir         output/dump
log             500
analysis        50.0
