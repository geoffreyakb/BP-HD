[Grid]
X1-grid         1   4.0     128      l    160.0
X2-grid         1   0.0     128      u    3.1415926535897932
X3-grid         1   0.0     128      u    6.2831853071795864
coarsening      static      X3

[TimeIntegrator]
CFL             0.5
tstop           75400.1
max_runtime     19.5
nstages         2

[Hydro]
solver          hllc
csiso           userdef
viscosity       explicit    userdef

[Gravity]
potential       userdef

[Boundary]
X1-beg          outflow
X1-end          outflow
X2-beg          axis
X2-end          axis
X3-beg          periodic
X3-end          periodic

[Setup]
epsilon         0.05
alpha           0.01
densityFloor    1e-6
gravity         Kepler
tilt            30
spin            0.1

[Output]
uservar         InvDt Vperp vCrosshx1 vCrosshx2 vCrosshx3
vtk             50.0
vtk_slice1      50.0      2   0.0                     cut
vtk_slice2      50.0      2   3.1415926535897932      cut
vtk_slice3      50.0      2   1.5707963267948966      cut
vtk_slice4      50.0      2   4.7123889803846898      cut
vtk_slice5      50.0      0   4.0                     cut
vtk_slice6      50.0      0   10.0                    cut
vtk_slice7      50.0      0   40.0                    cut
vtk_slice8      50.0      0   100.0                   cut
vtk_slice9      50.0      1   1.5707963267948966      cut
vtk_slice10     50.0      1   0.5235987755982988      cut
vtk_dir         output/vtk
dmp             1000.0
dmp_dir         output/dump
log             500
analysis        10.0
