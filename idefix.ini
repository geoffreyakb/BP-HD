[Grid]
X1-grid         1   4.0     128      l    160.0
X2-grid         1   0.0     128      u    3.1415926535897932
X3-grid         1   0.0     128      u    6.2831853071795864
coarsening      static      X3

[TimeIntegrator]
CFL             0.5
tstop           75400.1
max_runtime     3.5
nstages         2

[Hydro]
solver          hllc
csiso           userdef
viscosity       explicit    userdef

[Gravity]
potential       userdef

[Boundary]
X1-beg          outflow
X1-end          outflow
X2-beg          axis
X2-end          axis
X3-beg          periodic
X3-end          periodic

[Setup]
epsilon         0.05
alpha           0.01
densityFloor    1e-6
gravity         Kepler
tilt            45
spin            0.9

[Output]
uservar         InvDt
vtk             50.0
vtk_dir         output/vtk
dmp             1000.0
dmp_dir         output/dmp
log             100
analysis        10.0
